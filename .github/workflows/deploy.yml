name: 部署到 EC2（push 後自動更新）

# push 到 main（或手動觸發）時，在 EC2 上的 self-hosted runner 直接重新部署。
#
# 設計重點：不使用 runner 自己的 checkout 工作目錄（_work/...），而是明確操作
# EC2 上「固定的部署目錄」 ~/ntpc-smart-watchdog。原因：systemd 服務的
# WorkingDirectory 指向這個固定路徑，若在 runner 的臨時工作目錄跑會路徑錯亂、
# 且與腳本內的 git pull 互相干擾。固定目錄最單純、可預期。
#
# 前置：EC2 已依 docs/github-actions-deploy.md 安裝常駐 self-hosted runner（標籤 self-hosted），
#       且 ~/ntpc-smart-watchdog 是已接上 origin 的 git repo、runner 使用者有免密碼 sudo。

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".kiro/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    # 不做 actions/checkout：我們直接在固定部署目錄操作，避免 runner 工作目錄衝突。
    steps:
      - name: 在固定目錄拉最新程式碼並部署
        shell: bash
        env:
          DEPLOY_DIR: /home/ec2-user/ntpc-smart-watchdog
        run: |
          set -euo pipefail
          echo "==> 部署目錄：${DEPLOY_DIR}"
          cd "${DEPLOY_DIR}"

          echo "==> 拉取最新 main…"
          git fetch origin main
          git reset --hard origin/main
          echo "==> 目前 commit：$(git log --oneline -1)"

          echo "==> 執行部署腳本（重裝依賴 + 重啟服務）…"
          bash deploy/setup_ec2.sh

      - name: 健康檢查（服務是否起得來）
        shell: bash
        run: |
          sleep 8
          echo "== watchdog-gov 狀態 =="
          sudo systemctl is-active watchdog-gov.service || (sudo journalctl -u watchdog-gov -n 40 --no-pager; exit 1)
          echo "== watchdog-public 狀態 =="
          sudo systemctl is-active watchdog-public.service || (sudo journalctl -u watchdog-public -n 40 --no-pager; exit 1)
          echo "== 埠回應檢查 =="
          curl -fsS -o /dev/null -w "8601 -> HTTP %{http_code}\n" http://localhost:8601 || echo "!! 8601 尚未回應（可能仍在暖機）"
          curl -fsS -o /dev/null -w "8602 -> HTTP %{http_code}\n" http://localhost:8602 || echo "!! 8602 尚未回應（可能仍在暖機）"
